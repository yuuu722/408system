name: exam408-assistant
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: exam408
      POSTGRES_USER: exam408
      POSTGRES_PASSWORD: exam408
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations/000001_initial.up.sql:/docker-entrypoint-initdb.d/000001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam408 -d exam408"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: true
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://exam408:exam408@postgres:5432/exam408?sslmode=disable
      REDIS_ADDR: redis:6379
      STORAGE_ROOT: /data/uploads
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    healthcheck:
      test: ["CMD", "/exam408", "healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["uploads:/data/uploads"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: ./backend
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: true
    environment:
      APP_ROLE: worker
      DATABASE_URL: postgres://exam408:exam408@postgres:5432/exam408?sslmode=disable
      STORAGE_ROOT: /data/uploads
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    volumes: ["uploads:/data/uploads"]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["5173:80"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
  uploads:
