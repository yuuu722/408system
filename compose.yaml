name: exam408-assistant
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: exam408
      POSTGRES_USER: exam408
      POSTGRES_PASSWORD: exam408
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations/000001_initial.up.sql:/docker-entrypoint-initdb.d/000001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam408 -d exam408"]
      interval: 5s
      timeout: 3s
      retries: 20
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run scripts/start-kag.ps1 to generate NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4j-data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      start_period: 40s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: true
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://exam408:exam408@postgres:5432/exam408?sslmode=disable
      REDIS_ADDR: redis:6379
      STORAGE_ROOT: /data/uploads
      PERSONAL_KB_ENABLED: "true"
      GRAPH_BACKEND: neo4j
      ASSISTANT_MODE: kag
      NEO4J_URL: http://neo4j:7474
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    healthcheck:
      test: ["CMD", "/exam408", "healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["uploads:/data/uploads"]
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: ./backend
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: true
    environment:
      APP_ROLE: worker
      DATABASE_URL: postgres://exam408:exam408@postgres:5432/exam408?sslmode=disable
      STORAGE_ROOT: /data/uploads
      PERSONAL_KB_ENABLED: "true"
      GRAPH_BACKEND: neo4j
      ASSISTANT_MODE: kag
      NEO4J_URL: http://neo4j:7474
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    volumes: ["uploads:/data/uploads"]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["5173:80"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
  uploads:
  neo4j-data:
