# Docker DNS is rechecked after backend replacement; no static stale container IP.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;
upstream exam408_api {
  zone exam408_api 64k;
  server backend:8080 resolve;
}
server { listen 80; root /usr/share/nginx/html; index index.html;
  # Upper transport ceiling; backend advertises and enforces MAX_UPLOAD_MB (default 200).
  client_max_body_size 2049m;
  client_body_timeout 1800s;
  location /api/ { proxy_pass http://exam408_api; proxy_set_header Host $host; proxy_read_timeout 1800s; proxy_send_timeout 1800s; proxy_buffering off; }
  location /healthz { proxy_pass http://exam408_api; }
  location / { try_files $uri $uri/ /index.html; }
}
