server { listen 80; root /usr/share/nginx/html; index index.html;
  # Upper transport ceiling; backend advertises and enforces MAX_UPLOAD_MB (default 200).
  client_max_body_size 2049m;
  client_body_timeout 1800s;
  location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_read_timeout 1800s; proxy_send_timeout 1800s; proxy_buffering off; }
  location /healthz { proxy_pass http://backend:8080; }
  location / { try_files $uri $uri/ /index.html; }
}
