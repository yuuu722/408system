server { listen 80; root /usr/share/nginx/html; index index.html;
  # Upper transport ceiling; backend advertises and enforces MAX_UPLOAD_MB (default 200).
  client_max_body_size 513m;
  client_body_timeout 600s;
  location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_read_timeout 120s; proxy_buffering off; }
  location /healthz { proxy_pass http://backend:8080; }
  location / { try_files $uri $uri/ /index.html; }
}
